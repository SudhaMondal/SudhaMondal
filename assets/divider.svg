<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="900" height="72" viewBox="0 0 900 72" role="img" aria-label="Animated lavender and blush waves with facing whales, sakura petals, gems, seaweed, starfish, a seahorse and pearl oysters">
