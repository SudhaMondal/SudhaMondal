<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 240" role="img" aria-label="Detailed animated underwater illustration: realistic stylised whales, seahorses, swaying kelp, open pearl oysters, red crabs, shrimp, phytoplankton, stars and flowing pastel ocean currents">
<defs>
 <linearGradient id="water" x2="0" y2="1"><stop stop-color="#c9d9ee" stop-opacity=".12"/><stop offset=".35" stop-color="#b9c9e8" stop-opacity=".36"/><stop offset="1" stop-color="#bda8d7" stop-opacity=".2"/></linearGradient>
 <linearGradient id="current" x2="1"><stop stop-color="#f6c7df" stop-opacity="0"/><stop offset=".48" stop-color="#fff4fa" stop-opacity=".95"/><stop offset="1" stop-color="#c9b6ed" stop-opacity="0"/></linearGradient>
 <linearGradient id="whaleSkin" x1=".2" y1="0" x2=".75" y2="1"><stop stop-color="#8faec8"/><stop offset=".38" stop-color="#6f91b4"/><stop offset=".72" stop-color="#8e9fc4"/><stop offset="1" stop-color="#d9d9ed"/></linearGradient>
