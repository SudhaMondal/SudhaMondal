<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 240" role="img" aria-label="Animated naturalistic underwater seascape with anatomically detailed whales, seahorses, kelp, oysters, crabs, shrimp, starfish, sunlight rays and drifting marine particles">
<defs>
 <linearGradient id="water" x2="0" y2="1"><stop stop-color="#c9d9ee" stop-opacity=".12"/><stop offset=".35" stop-color="#b9c9e8" stop-opacity=".36"/><stop offset="1" stop-color="#bda8d7" stop-opacity=".2"/></linearGradient>
