</defs>
<rect width="1200" height="240" fill="url(#water)"/>
<path d="M0 67Q140 25 280 66T560 66T840 66T1120 66T1400 66" fill="none" stroke="url(#current)" stroke-width="15" opacity=".8"><animate attributeName="d" dur="9s" repeatCount="indefinite" values="M0 67Q140 25 280 66T560 66T840 66T1120 66T1400 66;M0 67Q140 100 280 66T560 66T840 66T1120 66T1400 66;M0 67Q140 25 280 66T560 66T840 66T1120 66T1400 66"/></path>
<path d="M0 83Q140 47 280 83T560 83T840 83T1120 83T1400 83" fill="none" stroke="#fff5fb" stroke-width="2.5" opacity=".8"><animate attributeName="d" dur="11s" repeatCount="indefinite" values="M0 83Q140 47 280 83T560 83T840 83T1120 83T1400 83;M0 83Q140 112 280 83T560 83T840 83T1120 83T1400 83;M0 83Q140 47 280 83T560 83T840 83T1120 83T1400 83"/></path>
<!-- whales: broad-bodied silhouettes with natural flukes, fins and rolling motion -->
<g><g transform="translate(265 66) scale(.83)"><use xlink:href="#whale"><animateTransform attributeName="transform" type="translate" values="0 0;22 -5;0 0" dur="15s" repeatCount="indefinite"/><animateTransform attributeName="transform" additive="sum" type="rotate" values="-2;2;-2" dur="6s" repeatCount="indefinite"/></use></g><g transform="translate(940 112) scale(-.62 .62)"><use xlink:href="#whale"><animateTransform attributeName="transform" type="translate" values="0 0;18 -4;0 0" dur="17s" repeatCount="indefinite"/></use></g></g>
<!-- kelp forests sway with the current -->
<g><g transform="translate(82 239)"><use xlink:href="#kelp"><animateTransform attributeName="transform" type="rotate" values="-5;5;-5" dur="8s" repeatCount="indefinite"/></use></g><g transform="translate(1120 239) scale(.85)"><use xlink:href="#kelp"><animateTransform attributeName="transform" type="rotate" values="5;-5;5" dur="9s" repeatCount="indefinite"/></use></g></g>
