<g transform="translate(1090 156) scale(-.78 .78)" stroke="#9f778e" stroke-width="1.5" stroke-linejoin="round"><path d="M-3 35Q-21 25-15 9Q-10-2-1-8Q-7-22 0-34Q8-45 20-37Q29-31 22-20L15-14Q16-4 26 6Q36 24 18 37Q8 45 0 37Q-6 32-1 26Q6 22 10 28Q14 32 8 35" fill="url(#seahorseSkin)"/><path d="M18-31L25-45L29-31L38-37L33-22" fill="#c9a5ad"/><path d="M18-28Q32-34 43-26L39-20Q28-17 18-19" fill="#edc6ad"/><circle cx="20" cy="-29" r="2.4" fill="#302c40" stroke="none"/><path d="M-3 1Q6 7 18 2M-5 8Q7 15 21 9M-5 16Q5 23 17 17M-3 24Q5 30 12 25" fill="none" stroke="#f5dfca" stroke-width="1.2"/></g>
<!-- open oysters, with layered nacre and softly gleaming pearls -->
