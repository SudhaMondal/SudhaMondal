 <linearGradient id="whaleSkin" x1=".2" y1="0" x2=".75" y2="1"><stop stop-color="#526f82"/><stop offset=".32" stop-color="#35576c"/><stop offset=".68" stop-color="#527b8a"/><stop offset="1" stop-color="#a9b9b5"/></linearGradient>
