<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 180" role="img" aria-label="Animated pastel underwater scene with whales, seahorses, seaweed, pearl oysters, phytoplankton, stars, red crabs and tiny shrimps">
<defs>
 <linearGradient id="sea" x2="0" y2="1"><stop stop-color="#e9d9fa"/><stop offset=".55" stop-color="#d7c9f0"/><stop offset="1" stop-color="#f8d9e8"/></linearGradient>
 <linearGradient id="foam" x2="1"><stop stop-color="#f8c9df"/><stop offset=".5" stop-color="#fff0fa"/><stop offset="1" stop-color="#cbb7ec"/></linearGradient>
 <linearGradient id="shell" x2="1" y2="1"><stop stop-color="#fff7fb"/><stop offset="1" stop-color="#cbb3dc"/></linearGradient>
 <g id="star" fill="#fff2c8" stroke="#d9b7d7" stroke-width="1"><path d="M0-11 3-4 11-3 5 2 7 10 0 5-7 10-5 2-11-3-3-4Z"/></g>
 <g id="whale" stroke="#967fb6" stroke-width="1.5" stroke-linejoin="round"><path d="M-42 0Q-37-25 0-25T42 0Q35 24 0 24T-42 0Z" fill="#cbb9e8"/><path d="M-40 0Q-58-20-67-12L-57 0-67 13Q-53 19-40 4Z" fill="#b9a4dc"/><path d="M-8 19Q5 32 17 20" fill="none"/><circle cx="27" cy="-6" r="3" fill="#55465f" stroke="none"/><circle cx="28" cy="-7" r="1" fill="white" stroke="none"/><path d="M32 3q5 4 9 0" fill="none"/><path d="M-3-24q-7-13 0-15q8 4 4 15" fill="#e9dafa"/><path d="M0-38q-7-10-3-13m8 13q8-10 5-13" fill="none" stroke="#b8a2d8"/></g>
 <g id="oyster" stroke="#a78ebd" stroke-width="1.2"><path d="M-25 7Q-23-18 0-20T25 7Q0 25-25 7Z" fill="#cbb8dc"/><path d="M-21 5Q-18-12 0-15T21 5Q0 17-21 5Z" fill="url(#shell)"/><path d="M-24 7Q0-4 24 7Q10 22-10 18Z" fill="#f5d7e8"/><circle cy="3" r="6" fill="#fffdf7"/><circle cx="-2" cy="1" r="2" fill="white" stroke="none"/></g>
 <g id="crab" stroke="#a94c61" stroke-width="1.4" stroke-linecap="round"><path d="M-18 2Q-15-12 0-12T18 2Q15 14 0 14T-18 2Z" fill="#ef6879"/><path d="M-14-5-22-14-29-12M14-5 22-14 29-12M-10 11-16 19M0 13V21M10 11 16 19" fill="none"/><path d="M-23-14q-10-8-12 1q2 8 10 4M23-14q10-8 12 1q-2 8-10 4" fill="#f58a91"/><circle cx="-6" cy="-3" r="2" fill="#392e48" stroke="none"/><circle cx="6" cy="-3" r="2" fill="#392e48" stroke="none"/></g>
 <g id="shrimp" stroke="#c77e91" stroke-width="1.4" fill="#f6b6c8"><path d="M-22 0Q-14-13 0-8Q15-4 19 6Q8 15-5 9Q-18 7-22 0Z"/><path d="M-17 4q-5 8-10 6m17-5-3 9m11-7-1 9m9-12 5 7" fill="none"/><path d="M16 2l9-6-2 12Z"/><circle cx="-13" cy="-2" r="1.7" fill="#493b55" stroke="none"/><path d="M-11-7q-7-10-12-9m15 9q-2-10 3-13" fill="none"/></g>
 <g id="seaweed" fill="none" stroke="#91bcae" stroke-width="5" stroke-linecap="round"><path d="M0 0Q-10-25 2-43Q13-58 5-72M0-4Q-20-25-18-42Q-16-55-25-63M2-5Q22-22 20-39Q18-50 29-60"/></g>
</defs>
<path d="M0 65Q150 30 300 65T600 65T900 65T1200 65V180H0Z" fill="url(#sea)" opacity=".78"/>
<path d="M0 68Q150 34 300 68T600 68T900 68T1200 68" fill="none" stroke="url(#foam)" stroke-width="9" opacity=".9"><animate attributeName="d" dur="8s" repeatCount="indefinite" values="M0 68Q150 34 300 68T600 68T900 68T1200 68;M0 68Q150 92 300 68T600 68T900 68T1200 68;M0 68Q150 34 300 68T600 68T900 68T1200 68"/></path>
<path d="M0 84Q150 52 300 84T600 84T900 84T1200 84" fill="none" stroke="#fff1fa" stroke-width="2" opacity=".8"><animate attributeName="d" dur="10s" repeatCount="indefinite" values="M0 84Q150 52 300 84T600 84T900 84T1200 84;M0 84Q150 110 300 84T600 84T900 84T1200 84;M0 84Q150 52 300 84T600 84T900 84T1200 84"/></path>
<g opacity=".95"><use href="#whale" transform="translate(260 55) scale(.72)"><animateTransform attributeName="transform" type="translate" values="260 55;285 49;260 55" dur="12s" repeatCount="indefinite"/></use><use href="#whale" transform="translate(930 95) scale(-.55 .55)"><animateTransform attributeName="transform" type="translate" values="930 95;900 90;930 95" dur="14s" repeatCount="indefinite"/></use></g>
<g><use href="#seaweed" transform="translate(75 177)"><animateTransform attributeName="transform" type="rotate" values="-4 75 177;5 75 177;-4 75 177" dur="6s" repeatCount="indefinite"/></use><use href="#seaweed" transform="translate(1125 177) scale(.9)"><animateTransform attributeName="transform" type="rotate" values="4 1125 177;-5 1125 177;4 1125 177" dur="7s" repeatCount="indefinite"/></use></g>
<use href="#oyster" transform="translate(500 146) scale(.75)"><animateTransform attributeName="transform" type="translate" values="500 146;500 141;500 146" dur="5s" repeatCount="indefinite"/></use>
<use href="#oyster" transform="translate(710 150) scale(.65)"/>
<use href="#crab" transform="translate(150 147) scale(.72)"><animateTransform attributeName="transform" type="translate" values="150 147;158 143;150 147" dur="4s" repeatCount="indefinite"/></use>
<use href="#crab" transform="translate(1045 145) scale(.75)"/>
<use href="#shrimp" transform="translate(390 112) scale(.65)"><animateTransform attributeName="transform" type="translate" values="390 112;405 107;390 112" dur="6s" repeatCount="indefinite"/></use>
<use href="#shrimp" transform="translate(825 132) scale(-.62 .62)"/>
<!-- Tiny seahorses -->
<g transform="translate(65 95)" stroke="#b783a9" stroke-width="2" fill="#f3c4d8"><path d="M0 20Q-12 14-6 3Q1-5-2-14Q-5-25 8-26Q20-26 16-15Q14-8 8-10Q8-3 16 3Q24 15 12 23Q4 28 0 20Z"/><path d="M0 20Q-10 29 0 33Q10 36 10 28" fill="none" stroke-width="4"/><path d="M15-21l13 4-12 4" fill="#f9dce9"/><circle cx="11" cy="-19" r="2" fill="#44374f" stroke="none"/></g>
<g transform="translate(1150 98) scale(.8)" stroke="#b783a9" stroke-width="2" fill="#f3c4d8"><path d="M0 20Q-12 14-6 3Q1-5-2-14Q-5-25 8-26Q20-26 16-15Q14-8 8-10Q8-3 16 3Q24 15 12 23Q4 28 0 20Z"/><path d="M0 20Q-10 29 0 33Q10 36 10 28" fill="none" stroke-width="4"/><path d="M15-21l13 4-12 4" fill="#f9dce9"/><circle cx="11" cy="-19" r="2" fill="#44374f" stroke="none"/></g>
<!-- phytoplankton: tiny glowing cells and drifting dots -->
<g fill="#fff5c9" stroke="#d6b6e1" stroke-width="1"><circle cx="350" cy="34" r="5"><animate attributeName="cy" values="34;24;34" dur="5s" repeatCount="indefinite"/></circle><circle cx="365" cy="43" r="3"/><circle cx="850" cy="36" r="4"><animate attributeName="cy" values="36;27;36" dur="4s" repeatCount="indefinite"/></circle><circle cx="875" cy="47" r="2.5"/></g>
<g><use href="#star" transform="translate(180 35) scale(.75)"><animate attributeName="opacity" values=".4;1;.4" dur="3s" repeatCount="indefinite"/></use><use href="#star" transform="translate(600 30) scale(.6)"><animateTransform attributeName="transform" type="rotate" values="0 600 30;30 600 30;0 600 30" dur="7s" repeatCount="indefinite"/></use><use href="#star" transform="translate(1010 36) scale(.8)"/></g>
<g fill="#fff" opacity=".8"><circle cx="220" cy="105" r="2"><animate attributeName="cy" values="105;92;105" dur="4s" repeatCount="indefinite"/></circle><circle cx="660" cy="90" r="2.5"><animate attributeName="cy" values="90;78;90" dur="5s" repeatCount="indefinite"/></circle><circle cx="780" cy="55" r="1.8"><animate attributeName="cy" values="55;45;55" dur="3s" repeatCount="indefinite"/></circle></g>
</svg>