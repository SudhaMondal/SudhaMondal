 <linearGradient id="shrimpSkin" x2="0" y2="1"><stop stop-color="#ffe1d8"/><stop offset=".45" stop-color="#ef9eaa"/><stop offset="1" stop-color="#c96e87"/></linearGradient>
 <linearGradient id="seahorseSkin" x2="1" y2="1"><stop stop-color="#f6d8a2"/><stop offset=".45" stop-color="#dcae91"/><stop offset="1" stop-color="#a9779d"/></linearGradient>
 <linearGradient id="kelp" x2="1" y2="0"><stop stop-color="#4e8f83"/><stop offset=".5" stop-color="#9bc8a8"/><stop offset="1" stop-color="#477e78"/></linearGradient>
