</g>
<g font-family="Segoe UI,Arial,sans-serif">
 <text x="55" y="150" font-size="49" font-weight="700" fill="#493454">Sudha Mondal</text>
 <text x="58" y="198" font-size="23" font-weight="600" fill="#806398">Biomedical Engineering Student</text>
 <text x="58" y="241" font-size="18" fill="#685273">Artificial heart systems · Cognitive neuroscience</text>
 <text x="58" y="276" font-size="17" fill="#806398">Bridging engineering precision with biological insight.</text>
 <path d="M58 302h285" stroke="#d99abf" stroke-width="5" stroke-linecap="round"/>
 <text x="58" y="339" font-size="15" fill="#9b78b8">✦ Research · Creativity · Curiosity ✦</text>
</g>
