<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420" role="img" aria-labelledby="title desc">
<title id="title">Kawaii anime girl waving hello</title>
<desc id="desc">A cheerful anime chibi girl with long wavy dark hair, sparkling violet eyes, round glasses, a large lavender bow and a lilac cardigan waves hello beside a sleepy white cat, against a dreamy lavender and pink floral background.</desc>
<defs>
 <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#fff5fb"/><stop offset=".52" stop-color="#f5e8fb"/><stop offset="1" stop-color="#e7dafa"/></linearGradient>
 <radialGradient id="glow"><stop stop-color="#fff" stop-opacity=".95"/><stop offset="1" stop-color="#efc9e8" stop-opacity="0"/></radialGradient>
 <linearGradient id="hair" x2=".8" y2="1"><stop stop-color="#76566f"/><stop offset=".42" stop-color="#302338"/><stop offset=".78" stop-color="#49334d"/><stop offset="1" stop-color="#9a7394"/></linearGradient>
 <linearGradient id="skin" x2="0" y2="1"><stop stop-color="#ffe9dc"/><stop offset="1" stop-color="#edb9aa"/></linearGradient>
 <linearGradient id="dress" x2="1" y2="1"><stop stop-color="#fffaff"/><stop offset="1" stop-color="#d9c4f2"/></linearGradient>
 <radialGradient id="eye"><stop stop-color="#fff"/><stop offset=".25" stop-color="#d7b9f4"/><stop offset=".7" stop-color="#8c62b1"/><stop offset="1" stop-color="#49335d"/></radialGradient>
 <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="9" stdDeviation="9" flood-color="#735a83" flood-opacity=".2"/></filter>
 <g id="flower"><circle r="5" cy="-9" fill="#fff4fc"/><circle r="5" cy="9" fill="#fff4fc"/><circle r="5" cx="-9" fill="#fff4fc"/><circle r="5" cx="9" fill="#fff4fc"/><circle r="4" fill="#e8a9ca"/></g>
</defs>
