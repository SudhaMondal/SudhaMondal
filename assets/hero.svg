<g opacity=".8"><use href="#flower" x="690" y="75" transform="translate(690 75) scale(1.2)"/><use href="#flower" x="965" y="300" transform="translate(965 300) scale(.8)"/><use href="#flower" x="650" y="335" transform="translate(650 335) scale(.65)"/></g>
<g fill="none" stroke="#c49bdc" stroke-width="3" stroke-linecap="round" opacity=".7">
