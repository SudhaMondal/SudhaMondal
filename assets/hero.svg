  <title id="title">Sudha Mondal — Biomedical Engineering</title>
  <desc id="desc">A soft lavender and blush-pink banner introducing Sudha Mondal, a biomedical engineering student interested in artificial heart systems, cognitive neuroscience, and interdisciplinary research. A simple illustrated researcher stands on the right.</desc>
