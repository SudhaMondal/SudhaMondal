<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="360" viewBox="0 0 1000 360" role="img" aria-labelledby="title desc">
  <title id="title">Sudha Mondal — Kawaii waving anime mascot</title>
  <desc id="desc">A cheerful kawaii anime girl with wavy dark hair, round glasses, a lavender bow and cardigan, smiling and waving her hand against a soft lavender and blush-pink background.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FBF4FF"/><stop offset=".58" stop-color="#F7E8F3"/><stop offset="1" stop-color="#E8DDF8"/></linearGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#59405F"/><stop offset=".55" stop-color="#302338"/><stop offset="1" stop-color="#765779"/></linearGradient>
    <linearGradient id="cardi" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F0E7FF"/><stop offset="1" stop-color="#CBB7EC"/></linearGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#FFE0CE"/><stop offset="1" stop-color="#EFB9A9"/></linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#735A83" flood-opacity=".2"/></filter>
  </defs>
  <rect width="1000" height="360" rx="26" fill="url(#bg)"/>
  <circle cx="875" cy="76" r="125" fill="#F4C9D9" opacity=".38"/><circle cx="760" cy="305" r="145" fill="#CBB7EC" opacity=".25"/>
  <g fill="#B58ACB" opacity=".7"><path d="M710 55l5 13 13 5-13 5-5 13-5-13-13-5 13-5z"/><path d="M954 245l4 10 10 4-10 4-4 10-4-10-10-4 10-4z"/><circle cx="680" cy="130" r="4"/><circle cx="940" cy="65" r="4"/></g>
  <g font-family="Segoe UI,Arial,sans-serif">
    <text x="52" y="145" font-size="48" font-weight="700" fill="#403052">Sudha Mondal</text>
    <text x="55" y="190" font-size="23" font-weight="600" fill="#765D8D">Biomedical Engineering Student</text>
    <text x="55" y="230" font-size="18" fill="#594866">Artificial heart systems · Cognitive neuroscience</text>
    <text x="55" y="261" font-size="17" fill="#765D8D">Bridging engineering precision with biological insight.</text>
    <path d="M55 286h285" stroke="#D98EAF" stroke-width="5" stroke-linecap="round"/>
    <text x="55" y="324" font-size="14" fill="#9B78B8">✦ Research · Creativity · Curiosity ✦</text>
  </g>
  <g transform="translate(790 0)" filter="url(#shadow)">
    <!-- hair behind the character -->
    <path d="M-104 153C-119 76-72 25-5 28 64 21 113 79 98 157l-4 105-37 47h-119l-40-54z" fill="url(#hair)"/>
    <!-- cardigan and shoulders -->
    <path d="M-126 354c3-83 30-112 83-119h52c58 8 82 39 88 119z" fill="url(#cardi)" stroke="#B79AD5" stroke-width="3"/>
    <path d="M-43 237l18 36 19-36 22 117h-82z" fill="#FFF8FF" stroke="#D9C4F2" stroke-width="2"/>
    <path d="M-20 276l-5 12 12 8 12-8-5-12" fill="none" stroke="#A984C4" stroke-width="3"/>
    <!-- neck -->
    <rect x="-19" y="205" width="38" height="43" rx="15" fill="url(#skin)"/>
    <!-- face -->
    <path d="M-72 103c0-48 31-74 72-74s72 26 72 74v68c0 43-31 73-72 73s-72-30-72-73z" fill="url(#skin)"/>
    <!-- fringe and side locks -->
    <path d="M-78 125C-91 64-49 17 3 25c56-1 88 44 73 106-9-24-22-37-42-48-22 20-58 22-91 8-4 18-9 30-21 43z" fill="url(#hair)"/>
    <path d="M-73 117c-12 55-2 112 22 139-31-4-52-40-48-84 2-23 10-43 26-55zM73 112c15 51 7 110-19 143 34-7 52-44 47-88-3-23-12-42-28-55z" fill="url(#hair)"/>
    <path d="M-48 65c19-26 51-34 79-22 15 6 27 17 35 32-33-12-64-9-93 7-8 4-15 9-22 16z" fill="#3B2A42"/>
    <!-- blush -->
    <ellipse cx="-43" cy="165" rx="15" ry="7" fill="#E88FA5" opacity=".34"/><ellipse cx="43" cy="165" rx="15" ry="7" fill="#E88FA5" opacity=".34"/>
    <!-- eyes -->
    <ellipse cx="-29" cy="143" rx="8" ry="12" fill="#51345C"/><ellipse cx="29" cy="143" rx="8" ry="12" fill="#51345C"/>
    <circle cx="-26" cy="139" r="3" fill="#FFF"/><circle cx="32" cy="139" r="3" fill="#FFF"/>
    <!-- glasses -->
    <g fill="none" stroke="#594866" stroke-width="3"><circle cx="-29" cy="144" r="20"/><circle cx="29" cy="144" r="20"/><path d="M-9 142q9-7 18 0"/></g>
    <!-- smile -->
    <path d="M-12 183q12 13 24 0" fill="none" stroke="#A85F72" stroke-width="3" stroke-linecap="round"/>
    <!-- bow in hair -->
    <path d="M-75 75q-42-29-41 4 4 25 42 10-32 32-3 39 25 1 27-34z" fill="#D9C4F2" stroke="#A984C4" stroke-width="3"/>
    <circle cx="-68" cy="93" r="8" fill="#B58ACB"/>
    <!-- little cardigan details -->
    <path d="M-73 278l23 20-9 9-22-20zM73 278l-23 20 9 9 22-20z" fill="#F8F0FF" stroke="#B79AD5" stroke-width="2"/>
    <path d="M-5 313l5 6 5-6" fill="none" stroke="#A984C4" stroke-width="2"/>
    <!-- waving arm: shoulder fixed, forearm and hand pivot at elbow -->
    <path d="M68 275q22-28 33-50" fill="none" stroke="#CBB7EC" stroke-width="30" stroke-linecap="round"/>
    <g transform="translate(101 226)">
      <animateTransform attributeName="transform" type="rotate" values="-28 0 48;24 0 48;-28 0 48" keyTimes="0;0.5;1" dur="0.72s" repeatCount="indefinite"/>
      <path d="M0 52Q-9 32-8 12l-1-30q0-9 8-9t9 9l2 25 5-39q1-9 9-8t8 10l-3 40 9-31q3-9 11-5t4 12l-8 35 12-20q5-8 12-2t-1 14L43 70Q30 91 8 82z" fill="url(#skin)" stroke="#D99F91" stroke-width="3" stroke-linejoin="round"/>
      <path d="M-4 55q17 12 35 0" fill="none" stroke="#E8A99E" stroke-width="2" opacity=".6"/>
    </g>
    <g fill="none" stroke="#D98EAF" stroke-width="3.5" stroke-linecap="round">
      <path d="M126 183q18-18 2-37"><animate attributeName="opacity" values=".15;1;.15" dur=".72s" repeatCount="indefinite"/></path>
      <path d="M140 195q23-24 3-49"><animate attributeName="opacity" values="1;.2;1" dur=".72s" repeatCount="indefinite"/></path>
      <path d="M112 171l-4-12"><animate attributeName="opacity" values=".2;1;.2" dur=".72s" repeatCount="indefinite"/></path>
    </g>
    <path d="M88 165q-8-12-15 0 7 13 15 0z" fill="#D98EAF"/>
  </g>
  <g transform="translate(912 305)" fill="#D98EAF" opacity=".8"><path d="M0 0c-17-15-29 5 0 24 29-19 17-39 0-24z"/></g>
</svg>